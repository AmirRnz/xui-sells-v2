version: '3.8'

services:
  app:
    image: xui-sells-v2:latest
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: xui-sells-app
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-xui_user}:${POSTGRES_PASSWORD:-xui_secret}@postgres:5432/${POSTGRES_DB:-xui_sells}?sslmode=disable
      - APP_ENV=production
      - PORT=8080
      - DATA_DIR=/app/data
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: xui-sells-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xui_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xui_secret}
      POSTGRES_DB: ${POSTGRES_DB:-xui_sells}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xui_user} -d ${POSTGRES_DB:-xui_sells}"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    container_name: xui-sells-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${WEB_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    profiles:
      - https

volumes:
  app_data:
  postgres_data:
  caddy_data:
  caddy_config:
